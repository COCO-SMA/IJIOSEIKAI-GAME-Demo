<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鲲城 RPG</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            overflow: hidden;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #gameCanvas {
            background: #0f0f1a;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        #loadingScreen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #e0e0e0;
            background: #1a1a2e;
            z-index: 100;
            transition: opacity 0.5s;
        }
        #loadingScreen h1 {
            font-size: 28px;
            margin-bottom: 16px;
            color: #a0a0c0;
        }
        #loadingScreen p {
            font-size: 14px;
            color: #606080;
        }
        #loadingScreen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loading-bar {
            width: 200px;
            height: 4px;
            background: #2a2a4e;
            border-radius: 2px;
            margin-top: 24px;
            overflow: hidden;
        }
        .loading-bar-fill {
            height: 100%;
            background: #5dcaa5;
            width: 0%;
            transition: width 0.3s;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="loadingScreen">
            <h1>鲲城 RPG</h1>
            <p id="loadingText">Loading...</p>
            <div class="loading-bar">
                <div class="loading-bar-fill" id="loadingBarFill"></div>
            </div>
        </div>
        <canvas id="gameCanvas"></canvas>
    </div>
    <script>
        window.addEventListener('error', (e) => {
            document.getElementById('loadingText').textContent = 'ERROR: ' + e.message;
        });
        window.addEventListener('unhandledrejection', (e) => {
            document.getElementById('loadingText').textContent = 'PROMISE ERROR: ' + (e.reason && e.reason.message || e.reason);
        });
    </script>
    <script src="src/main.js" type="module"></script>
</body>
</html>
